# kafka-front: transparent TCP proxy to the broker's EXTERNAL listener (kafka:9094). No auth, no TLS, by decision (row 489).
# Caps only: 60 connections in total, 20 at a time and 40 new per 10 s per address (a Kafka client opens a handful). Any address may connect.
global
    maxconn 60
    log stdout format raw local0
defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 15m
    timeout server 15m
    timeout client-fin 10s
    timeout server-fin 10s
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
frontend kafka
    bind :9092
    maxconn 60
    stick-table type ip size 20k expire 2m store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 20 }
    tcp-request connection reject if { sc_conn_rate(0) gt 40 }
    default_backend kafka
backend kafka
    server kafka kafka:9094 resolvers docker init-addr last,libc,none
