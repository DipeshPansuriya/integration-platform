# iPass showcase/staging copy on the Hostinger VPS (ADR-H-IPASS-01). Deployed to /docker/ipass next to the existing
# Traefik (external network `web`, resolver `letsencrypt`, entrypoint `websecure` - house guide section 2/4).
# Variable NAMES only here; values live in the server's root-only .env (bootstrap-env.sh generates it). No `latest`.
# Not routed on purpose: /v3, /actuator, Keycloak /admin and the master realm. Nothing publishes a port: Traefik
# reaches app/ui/keycloak over `web`; postgres and kafka sit on internal-only networks.
# demo profile: WireMock as an internal-only demo destination (ADR "Needs decision" 2), never routed.
name: ipass

x-logging: &logging
  # ADR Decision 6: journald so the host's MaxRetentionSec=30day is ADR-016's collector. A dev box without journald
  # (the local smoke) sets IPASS_LOG_DRIVER=json-file.
  driver: ${IPASS_LOG_DRIVER:-journald}

services:
  postgres:
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ipass_admin}
      POSTGRES_DB: ${POSTGRES_DB:-ipass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: Etc/UTC
      PGTZ: Etc/UTC
      # read by postgres-init/*.sh on the first start of an empty volume (and by a manual re-run)
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - ipass-pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [ipass-data]
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # compose/compose.yaml:89 - auto-create stays off; kafka-init creates the three platform topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      TZ: Etc/UTC
    volumes:
      - ipass-kafka-data:/var/lib/kafka/data
    networks: [ipass-work]          # internal: true - PLAINTEXT is acceptable only here (ADR Decision 5 point 10)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    cpus: 0.5
    logging: *logging

  kafka-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    restart: "no"
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    networks: [ipass-work]
    mem_limit: 256m
    cpus: 0.2
    logging: *logging

  keycloak:
    image: ${IPASS_IMAGE_PREFIX:-acsnewacr.azurecr.io/ipass}/keycloak:26.8.0-${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME:-https://auth.${IPASS_DOMAIN:?set IPASS_DOMAIN}}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # temporary bootstrap admin: replace with a named admin over SSH (kcadm.sh), then remove from .env
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-bootstrap-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set KC_BOOTSTRAP_ADMIN_PASSWORD}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=70
      TZ: Etc/UTC
      # placeholders of platform-realm.json, filled at import
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-platform-api}
      CONSOLE_OIDC_CLIENT_SECRET: ${CONSOLE_OIDC_CLIENT_SECRET:?set CONSOLE_OIDC_CLIENT_SECRET}
      CONSOLE_OIDC_REDIRECT_URI: https://ipass.${IPASS_DOMAIN}/login/oauth2/code/keycloak
      CONSOLE_POST_LOGOUT_REDIRECT_URI: https://ipass.${IPASS_DOMAIN}/
      PLATFORM_ADMIN_CLIENT_SECRET: ${PLATFORM_ADMIN_CLIENT_SECRET:?set PLATFORM_ADMIN_CLIENT_SECRET}
      OPERATOR_AGENT_CLIENT_SECRET: ${OPERATOR_AGENT_CLIENT_SECRET:?set OPERATOR_AGENT_CLIENT_SECRET}
    healthcheck:
      # no curl in the image: bash /dev/tcp against the management port (ADR Decision 6)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r l <&3 && case \"$$l\" in *' 200'*) exit 0;; esac; exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [web, ipass-data]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.ipass-auth.rule=Host(`auth.${IPASS_DOMAIN}`) && !PathPrefix(`/admin`) && !PathPrefix(`/realms/master`)
      - traefik.http.routers.ipass-auth.entrypoints=websecure
      - traefik.http.routers.ipass-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.ipass-auth.middlewares=ipass-sec-kc
      - traefik.http.routers.ipass-auth.service=ipass-auth
      - traefik.http.services.ipass-auth.loadbalancer.server.port=8080
      # Keycloak sets its own CSP and frame options: HSTS + nosniff only here
      - traefik.http.middlewares.ipass-sec-kc.headers.stsSeconds=31536000
      - traefik.http.middlewares.ipass-sec-kc.headers.contentTypeNosniff=true
    mem_limit: 1g
    cpus: 0.5
    logging: *logging

  platform-app:
    image: ${IPASS_IMAGE_PREFIX:-acsnewacr.azurecr.io/ipass}/platform-app:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    environment:
      TZ: Etc/UTC
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_PROFILES_ACTIVE: ${IPASS_PROFILES:-}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ipass}
      DB_USERNAME: ipass_app                  # K1: a restricted member of ipaas_app, owns nothing
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_MIGRATION_USERNAME: ipass_migrator   # Flyway owner, in-app at startup (ADR Decision 3)
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-https://auth.${IPASS_DOMAIN}/realms/platform}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-platform-api}
      CONSOLE_OIDC_CLIENT_ID: platform-console
      CONSOLE_OIDC_CLIENT_SECRET: ${CONSOLE_OIDC_CLIENT_SECRET:?set CONSOLE_OIDC_CLIENT_SECRET}
      CONSOLE_OIDC_REDIRECT_URI: https://ipass.${IPASS_DOMAIN}/login/oauth2/code/keycloak
      CONSOLE_POST_LOGOUT_REDIRECT_URI: https://ipass.${IPASS_DOMAIN}/
      CONSOLE_URL: https://ipass.${IPASS_DOMAIN}/
      PLATFORM_ADMIN_CLIENT_SECRET: ${PLATFORM_ADMIN_CLIENT_SECRET:?set PLATFORM_ADMIN_CLIENT_SECRET}
      PLATFORM_CREDENTIAL_KEK_K1: ${PLATFORM_CREDENTIAL_KEK_K1:?set PLATFORM_CREDENTIAL_KEK_K1}
      PLATFORM_CREDENTIAL_KEK_ACTIVE: K1
      IPASS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IPASS_KAFKA_PUBLISH_CLIENT_ID: ipass-relay
      IPASS_KAFKA_PLATFORM_TOPICS: platform.message.accepted,platform.delivery.due,platform.poison
      ROUTING_CORE_ALLOWED_SCHEMES: http,https
      # ADR Decision 5 point 9: the one allow-listed demo destination. Empty = every destination refused.
      PLATFORM_CONFIG_DESTINATIONS_ALLOWEDHOSTS: ${IPASS_DESTINATION_HOSTS:-}
      # showcase-only exception (needs IPASS_PROFILES=showcase): lets the guard accept the private WireMock address
      PLATFORM_CONFIG_DESTINATIONS_SHOWCASELOCALHOSTS: ${IPASS_SHOWCASE_LOCAL_HOSTS:-}
      PLATFORM_CONFIG_DESTINATIONS_SHOWCASELOCALPORTS: ${IPASS_SHOWCASE_LOCAL_PORTS:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 150s
    networks: [web, ipass-data, ipass-work]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.ipass-api.rule=Host(`ipass.${IPASS_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/oauth2`) || PathPrefix(`/login`) || Path(`/logout`))
      - traefik.http.routers.ipass-api.priority=100
      - traefik.http.routers.ipass-api.entrypoints=websecure
      - traefik.http.routers.ipass-api.tls.certresolver=letsencrypt
      - traefik.http.routers.ipass-api.middlewares=ipass-sec
      - traefik.http.routers.ipass-api.service=ipass-api
      - traefik.http.services.ipass-api.loadbalancer.server.port=8080
      - traefik.http.middlewares.ipass-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.ipass-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.ipass-sec.headers.customFrameOptionsValue=DENY
      - traefik.http.middlewares.ipass-sec.headers.contentSecurityPolicy=frame-ancestors 'none'
      - traefik.http.middlewares.ipass-sec.headers.referrerPolicy=same-origin
    mem_limit: 1536m
    cpus: 1.0
    logging: *logging

  ui:
    image: ${IPASS_IMAGE_PREFIX:-acsnewacr.azurecr.io/ipass}/ui:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: missing
    restart: unless-stopped
    networks: [web]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.ipass-ui.rule=Host(`ipass.${IPASS_DOMAIN}`)
      - traefik.http.routers.ipass-ui.priority=1
      - traefik.http.routers.ipass-ui.entrypoints=websecure
      - traefik.http.routers.ipass-ui.tls.certresolver=letsencrypt
      - traefik.http.routers.ipass-ui.middlewares=ipass-sec
      - traefik.http.routers.ipass-ui.service=ipass-ui
      - traefik.http.services.ipass-ui.loadbalancer.server.port=8080
    mem_limit: 64m
    cpus: 0.1
    logging: *logging

  pg-backup:
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      PGHOST: postgres
      BACKUP_DB_USERNAME: ipass_backup
      PGPASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ipass}
      TZ: Etc/UTC
    volumes:
      - ipass-backups:/backups
      - ./backup:/scripts:ro
    networks: [ipass-data]
    mem_limit: 128m
    cpus: 0.1
    logging: *logging

  # demo profile only: internal demo destination, on the internal work network, no Traefik label, no port.
  wiremock:
    image: wiremock/wiremock:3.13.1@sha256:d61e7720f89483fdef5366843b58d1dfd06bcce5828179c9f2f54de5c28354b0
    profiles: ["demo"]
    restart: unless-stopped
    command: ["--port", "8089", "--disable-banner"]   # not 8080: the guard refuses the app's own port
    networks: [ipass-work]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/__admin/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    mem_limit: 128m
    cpus: 0.2
    logging: *logging

networks:
  web:
    external: true
    name: web
  ipass-data:
    internal: true
  ipass-work:
    internal: true

volumes:
  ipass-pg-data:
  ipass-kafka-data:
  ipass-backups:
