# iPass showcase/staging copy on the Hostinger VPS (ADR-H-IPASS-01). Deployed to /docker/ipass next to the existing
# Traefik (external network `web`, resolver `letsencrypt`, entrypoint `websecure` - house guide section 2/4).
# Variable NAMES only here; values live in the server's root-only .env (bootstrap-env.sh generates it). No `latest`.
# Not routed on purpose: /v3, /actuator, Keycloak /admin and the master realm. Nothing publishes a port.
# Only the `edge` proxy joins the shared `web` network (Traefik -> edge); edge reaches app/ui/keycloak over the
# internal `ipass-front` network and enforces the path allow-list itself, so no other stack on `web` can reach the app,
# the actuator or Keycloak's admin directly. The app alone has outbound reach (`ipass-egress`) for allow-listed destinations.
# No test tooling here: the demo destination stub is demo/compose.demo.yaml (an explicit -f), never part of this file.
name: ipass

x-logging: &logging
  # ADR Decision 6: journald so the host's MaxRetentionSec=30day is ADR-016's collector. A dev box without journald
  # (the local smoke) sets IPASS_LOG_DRIVER=json-file.
  driver: ${IPASS_LOG_DRIVER:-journald}

# every stateless service: no capabilities, no privilege gain (postgres keeps its entrypoint capabilities)
x-hardened: &hardened
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ipass_admin}
      POSTGRES_DB: ${POSTGRES_DB:-ipass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: Etc/UTC
      PGTZ: Etc/UTC
      # read by postgres-init/*.sh on the first start of an empty volume (and by a manual re-run)
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD}
      RESTORE_DB_PASSWORD: ${RESTORE_DB_PASSWORD:?set RESTORE_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - ipass-pg-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks: [ipass-data]
    mem_limit: 512m
    cpus: 0.5
    logging: *logging

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # compose/compose.yaml:89 - auto-create stays off; kafka-init creates the three platform topics
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      TZ: Etc/UTC
    volumes:
      - ipass-kafka-data:/var/lib/kafka/data
    networks: [ipass-work]          # internal: true - PLAINTEXT is acceptable only here (ADR Decision 5 point 10)
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 768m
    cpus: 0.5
    logging: *logging
    <<: *hardened

  kafka-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    restart: "no"
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/scripts/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    networks: [ipass-work]
    mem_limit: 256m
    cpus: 0.2
    logging: *logging
    <<: *hardened

  keycloak:
    image: ${IPASS_KEYCLOAK_IMAGE:-${IPASS_IMAGE_PREFIX:-acsnewacr.azurecr.io/ipass}/keycloak:26.8.0-${IMAGE_TAG:?set IMAGE_TAG}}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KC_HOSTNAME:-https://auth.${IPASS_DOMAIN:?set IPASS_DOMAIN}}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # no admin credential here: the temporary bootstrap admin exists only for the first start, through
      # keycloak/compose.bootstrap-admin.yaml (README step 11), and is retired by keycloak/retire-bootstrap-admin.sh
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=70
      TZ: Etc/UTC
      # placeholders of platform-realm.json, filled at import
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-platform-api}
      CONSOLE_OIDC_CLIENT_SECRET: ${CONSOLE_OIDC_CLIENT_SECRET:?set CONSOLE_OIDC_CLIENT_SECRET}
      CONSOLE_OIDC_REDIRECT_URI: https://ipass.${IPASS_DOMAIN}/login/oauth2/code/keycloak
      CONSOLE_POST_LOGOUT_REDIRECT_URI: https://ipass.${IPASS_DOMAIN}/
      PLATFORM_ADMIN_CLIENT_SECRET: ${PLATFORM_ADMIN_CLIENT_SECRET:?set PLATFORM_ADMIN_CLIENT_SECRET}
      OPERATOR_AGENT_CLIENT_SECRET: ${OPERATOR_AGENT_CLIENT_SECRET:?set OPERATOR_AGENT_CLIENT_SECRET}
    healthcheck:
      # no curl in the image: bash /dev/tcp against the management port (ADR Decision 6)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r l <&3 && case \"$$l\" in *' 200'*) exit 0;; esac; exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [ipass-front, ipass-data]
    mem_limit: 1g
    cpus: 0.5
    logging: *logging
    <<: *hardened

  platform-app:
    image: ${IPASS_APP_IMAGE:-${IPASS_IMAGE_PREFIX:-acsnewacr.azurecr.io/ipass}/platform-app:${IMAGE_TAG:?set IMAGE_TAG}}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    environment:
      TZ: Etc/UTC
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_PROFILES_ACTIVE: ${IPASS_PROFILES:-}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ipass}
      DB_USERNAME: ipass_app                  # K1: a restricted member of ipaas_app, owns nothing
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      DB_MIGRATION_USERNAME: ipass_migrator   # Flyway owner, in-app at startup (ADR Decision 3)
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?set DB_MIGRATION_PASSWORD}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-https://auth.${IPASS_DOMAIN}/realms/platform}
      # the public edge hides /admin: the app reaches Keycloak's admin REST API on the internal service address
      # (tokens and the issuer stay the public URL above)
      KEYCLOAK_ADMIN_BASE_URI: ${KEYCLOAK_ADMIN_BASE_URI:-http://keycloak:8080}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-platform-api}
      CONSOLE_OIDC_CLIENT_ID: platform-console
      CONSOLE_OIDC_CLIENT_SECRET: ${CONSOLE_OIDC_CLIENT_SECRET:?set CONSOLE_OIDC_CLIENT_SECRET}
      CONSOLE_OIDC_REDIRECT_URI: https://ipass.${IPASS_DOMAIN}/login/oauth2/code/keycloak
      CONSOLE_POST_LOGOUT_REDIRECT_URI: https://ipass.${IPASS_DOMAIN}/
      CONSOLE_URL: https://ipass.${IPASS_DOMAIN}/
      PLATFORM_ADMIN_CLIENT_SECRET: ${PLATFORM_ADMIN_CLIENT_SECRET:?set PLATFORM_ADMIN_CLIENT_SECRET}
      PLATFORM_CREDENTIAL_KEK_K1: ${PLATFORM_CREDENTIAL_KEK_K1:?set PLATFORM_CREDENTIAL_KEK_K1}
      PLATFORM_CREDENTIAL_KEK_ACTIVE: K1
      IPASS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      IPASS_KAFKA_PUBLISH_CLIENT_ID: ipass-relay
      IPASS_KAFKA_PLATFORM_TOPICS: platform.message.accepted,platform.delivery.due,platform.poison
      ROUTING_CORE_ALLOWED_SCHEMES: http,https
      # ADR Decision 5 point 9: the one allow-listed demo destination. Empty = every destination refused.
      PLATFORM_CONFIG_DESTINATIONS_ALLOWEDHOSTS: ${IPASS_DESTINATION_HOSTS:-}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 150s
    networks: [ipass-front, ipass-data, ipass-work, ipass-egress]
    mem_limit: 1536m
    cpus: 1.0
    logging: *logging
    <<: *hardened

  # T219 operator view of Kafka (ops.<domain>/kafka/): READ-ONLY, topic names / partitions / offsets / consumer groups only.
  # Three independent layers: cluster readOnly flag, an RBAC role with no message permission (config/kafbat-roles.yml),
  # and edge.conf, which 404s every messages path and refuses any non-GET. Login is Keycloak OIDC (client ops-kafbat,
  # role ops-operator, OTP) - no anonymous access. Kafka stays PLAINTEXT on the internal ipass-work network only.
  kafbat:
    image: kafbat/kafka-ui:v1.5.0@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      kafka: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    environment:
      TZ: Etc/UTC
      JAVA_OPTS: -Xms128m -Xmx384m
      SERVER_SERVLET_CONTEXT_PATH: /kafka
      DYNAMIC_CONFIG_ENABLED: "false"
      KAFKA_CLUSTERS_0_NAME: ipass
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "true"
      SPRING_CONFIG_ADDITIONAL-LOCATION: file:/etc/kafkaui/kafbat-roles.yml
      AUTH_TYPE: OAUTH2
      AUTH_OAUTH2_CLIENT_KEYCLOAK_PROVIDER: keycloak
      AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENTNAME: Keycloak
      AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENTID: ops-kafbat
      AUTH_OAUTH2_CLIENT_KEYCLOAK_CLIENTSECRET: ${OPS_KAFBAT_CLIENT_SECRET:?set OPS_KAFBAT_CLIENT_SECRET}
      AUTH_OAUTH2_CLIENT_KEYCLOAK_SCOPE: openid
      AUTH_OAUTH2_CLIENT_KEYCLOAK_AUTHORIZATIONGRANTTYPE: authorization_code
      AUTH_OAUTH2_CLIENT_KEYCLOAK_REDIRECTURI: https://ops.${IPASS_DOMAIN}/kafka/login/oauth2/code/keycloak
      # the browser goes to the public auth host; the server-side calls use the internal Keycloak address (Kafbat has no egress)
      AUTH_OAUTH2_CLIENT_KEYCLOAK_AUTHORIZATIONURI: https://auth.${IPASS_DOMAIN}/realms/platform/protocol/openid-connect/auth
      AUTH_OAUTH2_CLIENT_KEYCLOAK_TOKENURI: http://keycloak:8080/realms/platform/protocol/openid-connect/token
      AUTH_OAUTH2_CLIENT_KEYCLOAK_JWKSETURI: http://keycloak:8080/realms/platform/protocol/openid-connect/certs
      AUTH_OAUTH2_CLIENT_KEYCLOAK_USERINFOURI: http://keycloak:8080/realms/platform/protocol/openid-connect/userinfo
      AUTH_OAUTH2_CLIENT_KEYCLOAK_USERNAMEATTRIBUTE: preferred_username
      AUTH_OAUTH2_CLIENT_KEYCLOAK_CUSTOMPARAMS_TYPE: oauth
      AUTH_OAUTH2_CLIENT_KEYCLOAK_CUSTOMPARAMS_ROLESFIELD: roles
    volumes:
      - ./kafbat/kafbat-roles.yml:/etc/kafkaui/kafbat-roles.yml:ro
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/kafka/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 60s
    networks: [ipass-front, ipass-work]
    mem_limit: 640m
    cpus: 0.5
    logging: *logging
    <<: *hardened

  ui:
    image: ${IPASS_UI_IMAGE:-${IPASS_IMAGE_PREFIX:-acsnewacr.azurecr.io/ipass}/ui:${IMAGE_TAG:?set IMAGE_TAG}}
    pull_policy: missing
    restart: unless-stopped
    networks: [ipass-front]
    mem_limit: 64m
    cpus: 0.1
    logging: *logging
    <<: *hardened

  # The only service on the shared `web` network: Traefik terminates TLS and sends both hostnames here. Same pinned nginx
  # image as `ui`, its own config (edge/edge.conf): app paths -> platform-app, auth host -> keycloak minus /admin and the
  # master realm, everything else -> ui, actuator and OpenAPI -> 404.
  edge:
    image: ${IPASS_UI_IMAGE:-${IPASS_IMAGE_PREFIX:-acsnewacr.azurecr.io/ipass}/ui:${IMAGE_TAG:?set IMAGE_TAG}}
    pull_policy: missing
    restart: unless-stopped
    depends_on:
      platform-app: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      ui: {condition: service_started}
      kafbat: {condition: service_healthy}
    volumes:
      - ./edge/edge.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [web, ipass-front]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.services.ipass-edge.loadbalancer.server.port=8080
      - traefik.http.routers.ipass-web.rule=Host(`ipass.${IPASS_DOMAIN}`)
      - traefik.http.routers.ipass-web.entrypoints=websecure
      - traefik.http.routers.ipass-web.tls.certresolver=letsencrypt
      - traefik.http.routers.ipass-web.middlewares=ipass-sec
      - traefik.http.routers.ipass-web.service=ipass-edge
      - traefik.http.middlewares.ipass-sec.headers.stsSeconds=31536000
      - traefik.http.middlewares.ipass-sec.headers.contentTypeNosniff=true
      - traefik.http.middlewares.ipass-sec.headers.customFrameOptionsValue=DENY
      - traefik.http.middlewares.ipass-sec.headers.contentSecurityPolicy=frame-ancestors 'none'
      - traefik.http.middlewares.ipass-sec.headers.referrerPolicy=same-origin
      # the auth host: /admin and the master realm stay unrouted at Traefik too (edge refuses them as well).
      # Keycloak sets its own CSP and frame options: HSTS + nosniff only here
      - traefik.http.routers.ipass-auth.rule=Host(`auth.${IPASS_DOMAIN}`) && !PathPrefix(`/admin`) && !PathPrefix(`/realms/master`)
      - traefik.http.routers.ipass-auth.entrypoints=websecure
      - traefik.http.routers.ipass-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.ipass-auth.middlewares=ipass-sec-kc
      - traefik.http.routers.ipass-auth.service=ipass-edge
      - traefik.http.middlewares.ipass-sec-kc.headers.stsSeconds=31536000
      - traefik.http.middlewares.ipass-sec-kc.headers.contentTypeNosniff=true
      # T219 operator host: Kafbat under /kafka only (edge 404s the rest); main-host security headers.
      - traefik.http.routers.ipass-ops.rule=Host(`ops.${IPASS_DOMAIN}`)
      - traefik.http.routers.ipass-ops.priority=10
      - traefik.http.routers.ipass-ops.entrypoints=websecure
      - traefik.http.routers.ipass-ops.tls.certresolver=letsencrypt
      - traefik.http.routers.ipass-ops.middlewares=ipass-sec
      - traefik.http.routers.ipass-ops.service=ipass-edge
    mem_limit: 64m
    cpus: 0.2
    logging: *logging
    <<: *hardened

  pg-backup:
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:      # the one backup credential - nothing else (no Keycloak, no restore, no superuser secret)
      PGHOST: postgres
      BACKUP_DB_USERNAME: ipass_backup
      PGPASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_DB: ${POSTGRES_DB:-ipass}
      TZ: Etc/UTC
    volumes:
      - ipass-backups:/backups
      - ./backup:/scripts:ro
    read_only: true
    tmpfs: [/tmp]
    networks: [ipass-data]
    mem_limit: 128m
    cpus: 0.1
    logging: *logging
    <<: *hardened

  # one-shot restore test (README step 14): docker compose --profile restore-test run --rm pg-restore-test
  pg-restore-test:
    image: postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb
    profiles: ["restore-test"]
    depends_on:
      postgres: {condition: service_healthy}
    entrypoint: ["/bin/sh", "/scripts/restore-test.sh"]
    environment:
      PGHOST: postgres
      BACKUP_DB_USERNAME: ipass_backup
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD}
      RESTORE_DB_USERNAME: ipass_restore
      RESTORE_DB_PASSWORD: ${RESTORE_DB_PASSWORD:?set RESTORE_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ipass}
      TZ: Etc/UTC
    volumes:
      - ipass-backups:/backups:ro
      - ./backup:/scripts:ro
    read_only: true
    tmpfs: [/tmp]
    networks: [ipass-data]
    mem_limit: 128m
    cpus: 0.1
    logging: *logging
    <<: *hardened

networks:
  web:                 # the host's shared Traefik network: edge only
    external: true
    name: web
  ipass-front:         # edge -> app/ui/keycloak; no outside reach, nothing else on it
    internal: true
  ipass-data:
    internal: true
  ipass-work:
    internal: true
  ipass-egress:        # the app's outbound reach (allow-listed destinations, the public issuer URL); nobody else joins

volumes:
  ipass-pg-data:
  ipass-kafka-data:
  ipass-backups:
