# edge proxy (the only service on the shared `web` network). Traefik terminates TLS and forwards both hostnames here.
# This file is the path allow-list: what the old Traefik path rules routed, and nothing else.
#   ipass.<domain>: /api /oauth2 /login /logout /actuator /v3 /swagger-ui -> platform-app, everything else -> ui (row 489: public by Dipesh's decision 27-Oct)
#   auth.<domain>:  Keycloak, ALL of it - admin console and master realm included (row 489 chunk C, Dipesh's decision 27-Oct)
#   ops.<domain>:   (T219) operator host, behind a Keycloak login: /kafka/ -> Kafbat (read-only, no message paths, GET
#                   only); anything else 404 (Keycloak is not served on ops; the admin console and master realm are on the auth host, which is public by row 489)
# Upstreams resolve lazily through Docker's DNS (a restarted container gets a new address without an edge restart).
resolver 127.0.0.11 valid=10s ipv6=off;

# Traefik is the only expected caller and has already set X-Forwarded-*; pass them on unchanged. A direct caller (the
# local smoke has no Traefik) gets the connection's own values.
map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }
map $http_x_forwarded_host  $fwd_host  { default $http_x_forwarded_host;  "" $host; }
map $http_x_forwarded_port  $fwd_port  { default $http_x_forwarded_port;  "" $server_port; }
map $http_upgrade $conn_upgrade { default upgrade; "" close; }

# Login rate limit (VAPT open item): about 10 requests/min per client with a burst of 5, 429 beyond it. The key is the LAST
# X-Forwarded-For entry - the one Traefik appends (the peer it saw); earlier entries are client-supplied and ignored, so
# a spoofed header does not buy a fresh budget. No header (the local smoke has no Traefik): the connection address. Behind
# Traefik $remote_addr is Traefik itself, which is why it is not the key. Two zones: Keycloak (token, form post) and the app login.
map $http_x_forwarded_for $ipass_client_ip { default $remote_addr; "~(?<last>[^,[:space:]]+)[[:space:]]*$" $last; }
limit_req_zone $ipass_client_ip zone=ipass_auth:10m rate=10r/m;
limit_req_zone $ipass_client_ip zone=ipass_login:10m rate=10r/m;
limit_req_status 429;
limit_req_log_level warn;

server {
  listen 8080;
  server_name ~^auth\.;
  server_tokens off;
  client_max_body_size 1m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $fwd_proto;
  proxy_set_header X-Forwarded-Host $fwd_host;
  proxy_set_header X-Forwarded-Port $fwd_port;
  # neither Keycloak nor Kafbat needs WebSocket/h2c: never forward Upgrade (Keycloak accepts a cleartext h2c upgrade and the
  # exchange then hangs, or bypasses the path rules)
  proxy_set_header Upgrade "";
  proxy_set_header Connection "";
  proxy_buffer_size 16k;
  proxy_buffers 4 16k;
  proxy_busy_buffers_size 32k;
  proxy_read_timeout 120s;
  set $kc http://keycloak:8080;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # the token and login POSTs stay rate limited on every realm, master included (10/min per client, burst 5)
  location ~ ^/realms/[^/]+/protocol/openid-connect/token/?$ { limit_req zone=ipass_auth burst=5 nodelay; proxy_pass $kc; }
  location ~ ^/realms/[^/]+/login-actions/authenticate/?$ { limit_req zone=ipass_auth burst=5 nodelay; proxy_pass $kc; }

  location / { proxy_pass $kc; }
}

# T219 operator host. Nothing here is anonymous: Kafbat authenticates through Keycloak (client ops-kafbat, role
# ops-operator, OTP); this block adds the allow-list and the rate limits. Keycloak is not served on this host (the admin console and master realm are public on the auth host, row 489). Kafbat is behind login; /__admin/ (WireMock) is anonymous by decision (row 489, chunk B).
server {
  listen 8080;
  server_name ~^ops\.;
  server_tokens off;
  client_max_body_size 1m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $fwd_proto;
  proxy_set_header X-Forwarded-Host $fwd_host;
  proxy_set_header X-Forwarded-Port $fwd_port;
  # neither Keycloak nor Kafbat needs WebSocket/h2c: never forward Upgrade (Keycloak accepts a cleartext h2c upgrade and the
  # exchange then hangs, or bypasses the path rules)
  proxy_set_header Upgrade "";
  proxy_set_header Connection "";
  proxy_buffer_size 16k;
  proxy_buffers 4 16k;
  proxy_busy_buffers_size 32k;
  proxy_read_timeout 120s;
  set $kafbat http://kafbat:8080;
  set $wiremock http://wiremock:8089;

  # The raw request path must already be in normal form. A percent sign is refused outright: nginx tests the once-decoded $uri
  # while Kafbat decodes again, so %25xx (double encoding) slipped past the message filter and the login rate limit, and a
  # decoded %0d%0a reached the upstream request line (request splitting, T219 N1/N2). Also refused: ';' (path parameters),
  # '//', and '.' / '..' path segments (also when the query string follows directly: '/..?x=1') and a backslash, so the raw path and nginx's normalised $uri are the SAME string and what is
  # filtered is exactly what Kafbat receives (it is forwarded unchanged, $request_uri). Kafbat needs none of these in its
  # paths (the platform topics are plain names); a topic whose name needs encoding is 404 here by design. Query string excluded.
  if ($request_uri ~ "^[^?]*(%|;|[\\\\]|//|/\.\.?(/|\?|$))") { return 404; }

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  absolute_redirect off;            # the edge listens on 8080 behind Traefik: never emit http://host:8080/...
  location = / { return 302 /kafka/; }

  # --- Kafbat (read-only). Message bodies: every path that can carry one is 404 here, in addition to the cluster
  # readOnly flag and the RBAC role without message rights. Only GET reaches the API; the one POST is the logout.
  location ^~ /kafka/actuator { return 404; }
  location ^~ /kafka/api/ {
    limit_except GET { deny all; }
    # anchored to the Kafbat API shape, so a topic merely NAMED like "messages" still opens. The raw path equals $uri here (see
    # the rule at the top of this block), and proxy_pass without a URI forwards $request_uri unchanged.
    if ($uri ~* "^/kafka/api/clusters/[^/]+/(topics/[^/]+/(messages|smartfilters|serdes)|smartfilters)") { return 404; }
    proxy_pass $kafbat;
  }
  location ^~ /kafka/oauth2 { limit_req zone=ipass_login burst=5 nodelay; limit_except GET { deny all; } proxy_pass $kafbat; }
  location ^~ /kafka/login  { limit_req zone=ipass_login burst=5 nodelay; limit_except GET { deny all; } proxy_pass $kafbat; }
  location = /kafka/logout  { limit_except POST { deny all; } proxy_pass $kafbat; }
  location ^~ /kafka/       { limit_except GET { deny all; } proxy_pass $kafbat; }

  # Row 489 chunk B (Dipesh's decision 27-Oct): the WireMock admin API and UI, ANONYMOUS and writable (stubs can be changed,
  # POST /__admin/shutdown stops it and Docker restarts it). WireMock is the demo destination stub; the app's own calls to it stay internal.
  location = /__admin { return 302 /__admin/; }
  location ^~ /__admin/ { proxy_pass $wiremock; }

  # everything else on ops is 404 - Keycloak (the admin console and master realm are public on the auth host by row 489; they are only not served on ops), health, metrics, unknown paths
  location / { return 404; }
}

server {
  listen 8080 default_server;
  server_name _;
  server_tokens off;
  client_max_body_size 25m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $http_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $fwd_proto;
  proxy_set_header X-Forwarded-Host $fwd_host;
  proxy_set_header X-Forwarded-Port $fwd_port;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $conn_upgrade;
  proxy_buffer_size 16k;
  proxy_buffers 4 16k;
  proxy_busy_buffers_size 32k;
  proxy_read_timeout 120s;
  set $app http://platform-app:8080;
  set $ui http://ui:8080;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  # Dipesh's decision 27-Oct (row 489): actuator and OpenAPI answer on the public app host. The APP decides what they return, not
  # this file: management.endpoints.web.exposure.include=health (platform-app application.yml:72) and the security chain permits only
  # /actuator/health[/readiness|/liveness] anonymously, denyAll for every other /actuator path, login needed for /v3/api-docs
  # (platform-tenancy TenancySecurityConfiguration.java:97-104). The app ships no Swagger UI, so /swagger-ui is the app's own answer.
  location ^~ /actuator    { proxy_pass $app; }
  location ^~ /v3          { proxy_pass $app; }
  location ^~ /swagger-ui  { proxy_pass $app; }

  location ^~ /api    { proxy_pass $app; }
  location ^~ /oauth2 { limit_req zone=ipass_login burst=5 nodelay; proxy_pass $app; }
  location ^~ /login  { limit_req zone=ipass_login burst=5 nodelay; proxy_pass $app; }
  location = /logout  { proxy_pass $app; }

  location / { proxy_pass $ui; }
}
