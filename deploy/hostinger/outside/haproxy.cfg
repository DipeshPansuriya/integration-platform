# pg-front: a transparent TCP proxy in front of Postgres. Postgres itself does TLS and pg_hba; HAProxy only counts and
# caps connections, so the database never sees more than `maxconn` outside connections and one address never holds more
# than 3 at a time or opens more than 10 in 10 s. Every address is still allowed (no IP allow-list).
global
    maxconn 20
    log stdout format raw local0
defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 5m
    timeout server 5m
    timeout client-fin 10s
    timeout server-fin 10s
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
frontend pg
    bind :5432
    maxconn 20
    stick-table type ip size 20k expire 2m store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 3 }
    tcp-request connection reject if { sc_conn_rate(0) gt 10 }
    default_backend pg
backend pg
    server postgres postgres:5432 resolvers docker init-addr last,libc,none
