# pg-front: a transparent TCP proxy in front of pg-demo. Postgres itself does TLS and pg_hba; HAProxy only counts and caps
# connections: at most 12 in total (= the 12 login slots of pg-demo), 3 at a time per address, 10 new per 10 s per address.
# Every address is still allowed (no IP allow-list). Honest limit: 4 or more attacking addresses together can keep all 12
# slots busy and lock other users out of the demo door; nothing else is affected (OUTSIDE-ACCESS.md section 6).
global
    maxconn 12
    log stdout format raw local0
defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    timeout client 5m
    timeout server 5m
    timeout client-fin 10s
    timeout server-fin 10s
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s
frontend pg
    bind :5432
    maxconn 12
    stick-table type ip size 20k expire 2m store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 3 }
    tcp-request connection reject if { sc_conn_rate(0) gt 10 }
    default_backend pg
backend pg
    server pg-demo pg-demo:5432 resolvers docker init-addr last,libc,none
