# pg_hba.conf of pg-demo (static; nothing is rendered). First match wins; anything not listed is refused.
# The demo instance is on the internal network ipass-pgfront only (shared with the proxy), and holds a copy of demo data only.
# TYPE    DATABASE    USER             ADDRESS  METHOD
# 1. container socket, admin only (docker exec on the host; the admin has no network rule at all)
local     all         ipass_demo_admin          trust
# 2. the ONE outside door: TLS only, one role, one database
hostssl   ipass_demo  ipass_outside    all      scram-sha-256
# 3. everything else is refused, explicitly (the healthcheck requires this exact shape: 3 rules, the last one `reject`)
host      all         all              all      reject
