# Lane B (T-001): the OIDC resource server (ADR-007 Decision 4), imported by platform-app's application.yml.
# Only environment variable NAMES (R07) and no default: without OIDC_ISSUER_URI and OIDC_AUDIENCE the application does
# not start (fail closed). The 60 s clock skew and the 2 s JWKS fetch timeout are fixed by ADR-007 in
# TenancySecurityConfiguration; any algorithm other than RS256 and ES256 is refused at start-up.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: ${OIDC_AUDIENCE}
          jws-algorithms:
            - RS256
            - ES256

# R13 / ADR-007 Decision 4: the controls on every identity-provider call (discovery, JWKS). No secret here - the
# values below are the defaults of IdentityProviderSettings, written out so an operator sees them. The 2 s timeout is
# fixed by ADR-007 and is not a setting.
platform:
  tenancy:
    identity-admin:
      # optional (env KEYCLOAK_ADMIN_BASE_URI): server address for the Keycloak admin REST calls only, e.g. http://keycloak:8080
      # when the public edge does not route /admin; empty = derived from OIDC_ISSUER_URI. Tokens and issuer stay public.
      base-uri: ${KEYCLOAK_ADMIN_BASE_URI:}
      # opt-in (env KEYCLOAK_ADMIN_ALLOW_EXTERNAL, default off): lets an https admin base point at a host other than the
      # issuer host (an external identity provider). Without it such a value stops the start-up. Plain http to a
      # non-internal host is refused either way.
      allow-external: ${KEYCLOAK_ADMIN_ALLOW_EXTERNAL:false}
    identity-provider:
      retry-max-attempts: 3            # first attempt included; transient failures only (refused, connect timeout, 429, 502-504)
      retry-initial-backoff: 200ms     # exponential random backoff ...
      retry-multiplier: 2.0
      retry-randomization: 0.5         # ... with +/- 50 % jitter ...
      retry-max-backoff: 2s            # ... and a cap
      breaker-failure-threshold: 5     # consecutive failed calls that open the one 'identity-provider' breaker
      breaker-wait-in-open: 30s        # then one half-open trial
      key-set-ttl: 5m                  # keys are fetched again after this
      key-set-fallback-max-age: 1h     # last fetched keys keep validating this long while the provider is down
