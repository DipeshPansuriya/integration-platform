spring:
  application:
    name: integration-platform
  # E1 seam: each lane's settings live in its own file in platform-tenancy (no two lanes edit one file).
  # tenancy-security.yml - lane B (OIDC resource server); tenancy-database.yml - lane C (Flyway owner, app role);
  # tenancy-console.yml - E4 lane D (console login as a backend for frontend, sessions in PostgreSQL).
  config:
    import:
      - optional:classpath:config/tenancy-security.yml
      - optional:classpath:config/tenancy-database.yml
      - optional:classpath:config/tenancy-console.yml
      # E5 seam (F13): one settings file per E5 lane, in that lane's module - config-contracts.yml (lane A,
      # platform-config), config-systems.yml (lane B: destination allow-list, test-connection rate limit),
      # config-secrets.yml (lane C: key-encryption-key env names, Keycloak admin client controls).
      - optional:classpath:config/config-contracts.yml
      - optional:classpath:config/config-systems.yml
      - optional:classpath:config/config-secrets.yml
      # E7||E8 seam (arjun-fullstack, F5/F6): one optional import line per lane settings file; the files themselves
      # arrive with the lanes that own them. transform.yml - E7 lane B2 (T-109's 5 s mapping budget, platform-transform).
      # routing-kafka.yml - E8's Kafka routing settings (platform-routing); FILL ONLY BY E8.
      # R07: every value below stays an environment-variable NAME - no value, no default, in any of these files.
      - optional:classpath:config/transform.yml
      - optional:classpath:config/routing-kafka.yml
      # E9 seam (arjun-fullstack, F14): config/routing-core.yml - lane A (bulkhead size, routing budget,
      # allowedSchemes). R07: every value stays an environment-variable NAME - no value, no default.
      - optional:classpath:config/routing-core.yml
  # R07: connection settings come only from environment variable names; no value, no default.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
