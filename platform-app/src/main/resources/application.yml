spring:
  application:
    name: integration-platform
  # Karan M1 (row 372): the admin API is JSON-only; Boot's FormContentFilter would read a form-encoded PUT/PATCH/DELETE
  # body in full BEFORE authentication and before AdminRequestSizeFilter (AdminFormPutNotBufferedTest).
  mvc:
    formcontent:
      filter:
        enabled: false
  # E1 seam: each lane's settings live in its own file in platform-tenancy (no two lanes edit one file).
  # tenancy-security.yml - lane B (OIDC resource server); tenancy-database.yml - lane C (Flyway owner, app role);
  # tenancy-console.yml - E4 lane D (console login as a backend for frontend, sessions in PostgreSQL).
  config:
    import:
      - optional:classpath:config/tenancy-security.yml
      - optional:classpath:config/tenancy-database.yml
      - optional:classpath:config/tenancy-console.yml
      # E5 seam (F13): one settings file per E5 lane, in that lane's module - config-contracts.yml (lane A,
      # platform-config), config-systems.yml (lane B: destination allow-list, test-connection rate limit),
      # config-secrets.yml (lane C: key-encryption-key env names, Keycloak admin client controls).
      - optional:classpath:config/config-contracts.yml
      - optional:classpath:config/config-systems.yml
      - optional:classpath:config/config-secrets.yml
      # E7||E8 seam (arjun-fullstack, F5/F6): one optional import line per lane settings file; the files themselves
      # arrive with the lanes that own them. transform.yml - E7 lane B2 (T-109's 5 s mapping budget, platform-transform).
      # routing-kafka.yml - E8's Kafka routing settings (platform-routing); FILL ONLY BY E8.
      # R07: every value below stays an environment-variable NAME - no value, no default, in any of these files.
      - optional:classpath:config/transform.yml
      - optional:classpath:config/routing-kafka.yml
      # E9 seam (arjun-fullstack, F14): config/routing-core.yml - lane A (bulkhead size, routing budget,
      # allowedSchemes). R07: every value stays an environment-variable NAME - no value, no default.
      - optional:classpath:config/routing-core.yml
      # E14 seam (arjun-fullstack, F8): scheduler.yml arrives with lane B's T-056 (platform-app owns the runtime
      # wiring, ADR-012 section 2) - the db-scheduler task-table name (schema scheduler), enabled flag, poll interval.
      - optional:classpath:config/scheduler.yml
      # T204 (L4): migrations fail fast on a lock wait (init-sql lock_timeout) instead of queueing behind a long transaction.
      - optional:classpath:config/flyway-lock-timeout.yml
  # R07: connection settings come only from environment variable names; no value, no default.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # T64 (Karan P-1, row278 review): the pool is explicit, not the silent Hikari default - the row306 smoke hit
    # HikariPool-1 total=10 active=10 exhausted, other calls hung 30 s then failed (_reports/
    # row306-demo-smoke-20261012.txt:92-95, CWE-400/770 availability risk). The smallest sane sizing: Postgres
    # default max_connections=100 keeps the headroom for the owner login, the sessions, the admin tooling and
    # further instances; 10 per instance is the figure the platform already runs on - pinned so a Boot upgrade
    # cannot change it quietly. The 30 s borrow patience and the 60 s leak report (Karan's P-1 figure, below the
    # borrow patience) are safety figures, not deploy-time parameters, so they carry values here (the
    # tenancy-console.yml precedent: fixed figures that must not be configurable away).
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      leak-detection-threshold: 60000
  # T65 (Karan P-1): the platform default transaction timeout is unbounded; pinned to 30 s so a long-borrow
  # stall surfaces as a bounded timeout, matched to the pool's 30 s borrow patience above - a stuck transaction
  # start never holds a pool slot past it. Every state change still rechecks its own deadline through the
  # one lock order (ADR-014's 40001/40P01 in-place retries stay well inside).
  transaction:
    default-timeout: 30

# L15 (security gate S5-A1): the admin API (/api/v1/admin/**) refuses a request body over this many bytes with a 413,
# before it is read into memory. Default 2 MB; intake (/api/v1/interfaces/**) is not covered (own shape and bulk caps).
platform:
  admin-api:
    max-request-body-bytes: ${ADMIN_API_MAX_REQUEST_BODY_BYTES:2097152}

management:
  endpoints:
    web:
      exposure:
        include: health
# T-066 (row 278 T108): masked-field values are scrubbed from every JSON log line (logback-spring.xml's encoder).
logging:
  structured:
    json:
      customizer: io.integrationplatform.app.logging.MaskingLogCustomizer
