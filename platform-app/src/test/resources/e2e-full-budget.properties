# T-153 (E18-F1-S3): the memory budget of the full suite's bounded load, enforced by MemoryBudgetContainerTest.
# Load: 200 messages, 4 parallel posters, API target, one JVM at -Xmx1g (pom profile e2e-full).
# MEASURED 2026-10-22 on the build PC (run e2e-full, n = 1): baseline 71 MiB, peak heap 201 MiB, retained after drain
# 1 MiB, pool active peak 5 of 10, pool waiters 0, backlog peak 310 (outbox rows + unsettled deliveries), drain 12 s.
# Recorded budget = measured + 25 %, rounded up, with a floor where the measure was 0 or 1. Re-measure after a change
# to the pipeline's threading or the pool size; n = 1 is a starting record, not a distribution.
heap.peak.mib=256
heap.retained.growth.mib=64
pool.pending.max=5
backlog.max=400
drain.seconds=30
