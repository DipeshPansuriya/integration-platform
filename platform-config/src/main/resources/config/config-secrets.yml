# E5 lane C (T-103, T-185), imported optionally by platform-app's application.yml
# (optional:classpath:config/config-secrets.yml). NO SECRET BELONGS IN THIS FILE (R07; gitleaks runs):
# the key-encryption keys are read only from the deployment's secret store through the environment-variable
# NAMES PLATFORM_CREDENTIAL_KEK_<ID> (32 bytes, base64) and PLATFORM_CREDENTIAL_KEK_ACTIVE (the id that seals
# new values); the Keycloak admin client's secret only through PLATFORM_ADMIN_CLIENT_SECRET (ADR-007
# Decisions 3 and 7). The Keycloak admin calls carry the shared identity-provider timeout, retry and breaker
# settings of tenancy-security.yml (one breaker for the provider).
platform:
  tenancy:
    source-credential:
      # ADR-007 Decision 3: a rotated source credential keeps working this long, then it is refused and revoked
      rotation-grace: 7d
      # an issue that never finished (PENDING) is revoked by the credential reconciliation after this age
      pending-timeout: 15m

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # ADR-007 Decision 7 rule 5 / ADR-010 section 9 item 4: an instance without a key-encryption key that a
        # target credential needs is taken out of service (readiness 503) - never restarted (liveness stays up).
        readiness:
          include: readinessState,targetCredentialKeys
