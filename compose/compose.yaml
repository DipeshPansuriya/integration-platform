# Local development harness: PostgreSQL, Keycloak, Kafka (E8) and the engineers' Kafbat UI (T-077).
# R05: every image pinned to the exact tag the tests use (TestImages.POSTGRES, TestImages.KEYCLOAK,
# KafkaImages.KAFKA, KafkaImages.KAFBAT - the digest pins Kafbat's release tag).
# R07: no literal credential - every value comes from a variable; POSTGRES_PASSWORD has no default and compose
#      refuses to start without it. Names are listed in compose.env.example; values live in the OS secret store.
# Networks (E8-F2-S1 @negative @security): Kafka joins the work network (what the routing consumers share) and
#      the operations network; Kafbat joins the operations network ONLY - never the default tenant-facing network
#      postgres/keycloak and the console sit on, and it requires its own login (KAFBAT_UI_* variables).
# E15 (F17/T143): the e2e profile adds Artemis (the JMS broker) and WireMock (the stand-in destination), pinned to
#      E2eImages.ARTEMIS / E2eImages.WIREMOCK (platform-e2e); without --profile e2e neither starts. Compose still
#      interpolates inactive-profile services (measured, Compose v5.6.0), so ARTEMIS_USER/ARTEMIS_PASSWORD must be set
#      for every compose command, like the other names.
# Usage: docker compose -f compose/compose.yaml up -d   (one Docker suite at a time on the build PC, R06)
#        docker compose -f compose/compose.yaml --profile e2e up -d   (adds artemis + wiremock; ARTEMIS_* set too)
name: integration-platform

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: Etc/UTC
      PGTZ: Etc/UTC
      # ADR-007 Decision 1: Keycloak runs on its own database and login (created by the init script from the
      # KEYCLOAK_DB_* names below on the first start of an empty volume); it only shares the server.
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:?set KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?set KEYCLOAK_DB_USERNAME}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  # E4 (T-097, ADR-007 Decisions 1 and 3): the identity provider. Realm `platform` is imported from
  # keycloak/platform-realm.json on first start; every secret in that file is a ${VAR} placeholder filled from
  # the variables below (R07). Issuer: http://localhost:8180/realms/platform (OIDC_ISSUER_URI of the backend).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:?set KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME:?set KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      TZ: Etc/UTC
      # Placeholders of platform-realm.json:
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?set OIDC_AUDIENCE}
      CONSOLE_OIDC_CLIENT_SECRET: ${CONSOLE_OIDC_CLIENT_SECRET:?set CONSOLE_OIDC_CLIENT_SECRET}
      CONSOLE_OIDC_REDIRECT_URI: ${CONSOLE_OIDC_REDIRECT_URI:?set CONSOLE_OIDC_REDIRECT_URI}
      CONSOLE_POST_LOGOUT_REDIRECT_URI: ${CONSOLE_POST_LOGOUT_REDIRECT_URI:?set CONSOLE_POST_LOGOUT_REDIRECT_URI}
      PLATFORM_ADMIN_CLIENT_SECRET: ${PLATFORM_ADMIN_CLIENT_SECRET:?set PLATFORM_ADMIN_CLIENT_SECRET}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro

  # E8 (T-044/T-077, ADR-010): the work broker, one KRaft node. Same pinned tag as the KafkaHarness
  # (KafkaImages.KAFKA); topic auto-creation off there and here so the harness/code decides the topics.
  # Networks: work (the routing module reaches it there) and operations (Kafbat reads it there) - never the
  # tenant-facing default network. The host port is loopback-only for local admin tools.
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: false
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:9092:9092"
    networks:
      - work
      - operations
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # E8-F2-S1 (T-077): the engineers' Kafka view - topics, lag and consumer groups for platform people only.
  # Pinned by the same digest the tests pin (KafkaImages.KAFBAT); release tag v1.5.0 cannot be named as a plain
  # tag, so the digest of that tag pins it instead. Operations network ONLY (never tenant-facing) and its own
  # login: AUTH_TYPE LOGIN_FORM with the credentials from the KAFBAT_UI_* variable names (R07: names only).
  kafbat:
    image: kafbat/kafka-ui@sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: platform
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: ${KAFBAT_UI_USER:?set KAFBAT_UI_USER}
      SPRING_SECURITY_USER_PASSWORD: ${KAFBAT_UI_PASSWORD:?set KAFBAT_UI_PASSWORD}
      DYNAMIC_CONFIG_ENABLED: "false"
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - operations

  # E15 (F17/T143): the JMS broker of the end-to-end scenarios - e2e profile only. Login from the ARTEMIS_* variable
  # names (R07), anonymous login off; host ports are loopback-only (61616 core/AMQP/OpenWire, 8161 console).
  artemis:
    image: apache/activemq-artemis:2.44.0@sha256:0305c26f19eda00c0506d0953cfe265600a72ac1b17f7934412120c01a595cff
    profiles: ["e2e"]
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:?set ARTEMIS_USER}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:?set ARTEMIS_PASSWORD}
      ANONYMOUS_LOGIN: "false"
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:61616:61616"
      - "127.0.0.1:8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/artemis-instance/bin/artemis check node --up --user \"$${ARTEMIS_USER}\" --password \"$${ARTEMIS_PASSWORD}\""]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # E15 (F17/T143): the stand-in HTTP destination of the end-to-end scenarios - e2e profile only. Same tag+digest as
  # platform-config's WireMockDestination; host port loopback-only (8089 -> WireMock's 8080).
  wiremock:
    image: wiremock/wiremock:3.13.1@sha256:d61e7720f89483fdef5366843b58d1dfd06bcce5828179c9f2f54de5c28354b0
    profiles: ["e2e"]
    environment:
      TZ: Etc/UTC
    ports:
      - "127.0.0.1:8089:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  work:
  operations:

volumes:
  postgres-data:
