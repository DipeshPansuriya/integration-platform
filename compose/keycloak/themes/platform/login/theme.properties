# Keycloak realm login theme - lane K, ui-modernization wave 1 (T79).
# parent=base keeps Keycloak's own styling fully out of the way: no PatternFly
# utility classes to chase across Keycloak releases, every visual decision is
# made here against the wave-1 token values.
parent=base
# Linked CSS: tokens first (custom properties), then the layout/skin.
styles=css/tokens.css css/styles.css
# row310 T86: base leaves every kc*Class property empty, so the elements the base template
# renders outside #kc-content got no hook. Name the few the skin needs (no .ftl override):
# - kcFormCardClass: the card that holds the <header> with h1#kc-page-title AND #kc-content,
#   so the page title sits inside the card instead of floating above it.
# - the password-visibility toggle (base/login/login.ftl + base js/passwordVisibility.js, which
#   swaps the <i> between the Show/Hide icon classes and the aria-label between the
#   showPassword/hidePassword messages): the icon classes carry a visible word, no icon font.
kcFormCardClass=platform-card
kcInputGroup=platform-input-group
kcFormPasswordVisibilityButtonClass=platform-password-toggle
kcFormPasswordVisibilityIconShow=platform-password-show
kcFormPasswordVisibilityIconHide=platform-password-hide
